ource snapshot matches v64 byte-for-byte; the full-link artifact remains unselected and does not qualify hardware ownership or execution.", "The isolated iOS26 v178-v183 chain now has exact K80 evidence for ZAP authentication, first canaries/fence, read-only native metadata attach and a fixed32x32 RGBA8 CP_BLIT task with full CPU result verification and unmap. These candidate results do not select a published production GPU frontend."]
