# Official record schema 1; build remains schema 1. Worktree evidence is hash-bound.
schema_version = 1

[device]
name = "zorn"
soc = "SM8650"
os_profile = "ipados-17.7.11-21H461"
summary = "红米 K80 12 GB + 256 GB；已确认 iPadOS 桌面、基本单指触控、八核、8 GiB Data 跨启动保留及低亮度。仍为有界自动回收调试配置；完整格式 2 构建迁移、多指、GPU 与长期稳定性尚未完成。"

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "unixnu.lock", "configs/**", "patches/core/**", ".github/**", ".gitignore", "scripts/install-zorn-patches.sh", "source-pins.json", "scripts/check-zorn-patch-series.py", "scripts/check-zorn-source-pins.py", "scripts/stage-zorn-build-workspace.py", "patches/compat/**"]
inputs = ["K80 zorn / SM8650-AB，iPad7,1 / j120ap，iPadOS 17.7.11 / 21H461；主 UniXNU 16e592abee8a550dec8154ed1f38b5ebc4f16213，XNU d8b80295118ef25ac3a784134bcf95cd8e88109f。", "后续主仓库066c8d8与sheng08cde20；当前组件用source-pins.json固定19个实际检出及363个源码指纹。"]
configuration = ["现有 board.toml 保持格式 1；board.os_profile 仅用于记录身份核对；桌面配置为 zorn_union_defconfig。"]
procedure = ["按 docs/build-and-debug.md 准备已有增量工作区；在主仓库运行 python3 scripts/porting-record.py check --device ../UniXNU-zorn。"]
findings = ["保留两个设备仓库与格式1入口；上游独立工作区已两次重放157个补丁，并完成1011个新XNU对象、预链接及统一打包。", "显式--source-pins在构建前和打包前验证组件，不执行子模块更新；错误版本、改动文件和缺少组件均拒绝。"]
completion = ["设备、系统身份和输入版本一致；后续完整格式 2 迁移另行验证配置层、DTS、源码与补丁顺序。"]
limits = ["完整格式2构建未迁移；干净源码重放和独立对象编译通过，但历史ABI候选仍是显式输入，新候选首次真机在CPU1预检261退出。"]
next_action = ["保留42f3d518，按同一recovery起点做对照，定位启动差异后继续重复回归；再消除ABI fixture依赖。"]

[[area.evidence]]
kind = "source"
reference = "docs/repository-format.md"
result = "说明本次文档范围、记录版本与构建格式的区别；未宣称新布局通过。"

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["docs/progress-2026-10-27*.md", "docs/progress-2026-10-28-touch.md", "docs/evidence/touch-power-handoff-result.json"]
inputs = ["相邻 uefi-zorn 板级包、Mu-Silicium 共享依赖、giulia SM8650 DXE 输入、GOP、PSCI SMC 与实机保留区。"]
configuration = ["zorn.dsc / zorn.fdf；3 MiB FD 位于 0xA7100000，BootShim 解压窗口为 0xA8000000–0xB8000000，邮箱 0xA7601000。"]
procedure = ["按 uefi-zorn 的 build-and-handoff.md 链接板级包、构建 FD、核对模块及固件哈希，再使用统一构建器打包。"]
findings = ["UEFI 菜单、5 秒倒计时和 DarwinBoot 交接已实测；触控供电交接为内核 FT3683 通信提供前提。"]
completion = ["固件输入、菜单、内存与 sidecar 一致，交接后进入已绑定内核；每轮 watchdog 与自动 recovery 结果可追溯。"]
limits = ["固件源码与厂商 DXE 不混为完整开源实现；本仓库不是完整 Mu-Silicium；精确复位源尚未独立测定。"]
next_action = ["继续保留固件和模块身份，避免更新 FD 时丢失触控供电或提前 watchdog 前提。"]

[[area.evidence]]
