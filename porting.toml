configuration = ["--smp-preflight 8 --smp-continue；每轮通过全部核心预检后才继续用户态；不以 ADT 八节点代替真实在线证据。"]
procedure = ["逐核核对身份、定时器、IPI 与绑定任务，执行九轮共享 VA 映射及清理，再检查系统桌面和对应回收日志。"]
findings = ["37100a75 已通过八核和九轮 remap / cleanup；42f3d518 中各核检查掩码均为 ff，并进入桌面。", "前序 CPU1 SMP261 表示启动返回后未在有界窗口内同时观察到 Running / IPI；后续成功不能证明其原因已修复。", "0b4eda46首次新日志记录START1 step4 / PSCI rc0 / fail0，CPU1未在原2秒门槛到达身份与Running/IPI，自动回recovery；不把CPU_ON返回0等同核心已在线。", "资格检查现支持档案搬迁，以唯一相对后缀定位原输入，不重写旧manifest或放宽哈希、代码和设备检查。"]
completion = ["八核身份、定时器、IPI、跨核映射及用户态均有匹配证据，失败诊断保留，启动和长期压力稳定性通过。"]
limits = ["当前通过基本八核系统启动；偶发 CPU1 预检早退原因未定，无 AMP、DVFS 或性能成绩验收。"]
next_action = ["遇到再次早退时保留 START 状态、PSCI 返回与时间关系；做长时间调度与共享映射压力测试。"]

